.title[
# Determinants of the <em>Nerodia rhombifer</em> Microbiome
]
.subtitle[
## Disentangling Host Control from Environmental Stochasticity
]
.author[
### Edgardo L. Rosado Ramos
]
.date[
### 2025-12-03
]

---








# Study Design &amp; Data Rigor

.pull-left[
### Experimental Setup
*   **Subject:** *Nerodia rhombifer* (Diamondback Water Snake)
*   **Factors:**
    *   **Maternal Identity:** Vertical transmission / Genetic background.
    *   **Environment:** "Muck" (Native) vs. "Sterile" (Clean).
    *   **Ontogeny:** Fetus `\(\to\)` Newborn `\(\to\)` 7, 15, 20 Days.

### Data Processing
*   **Raw Sequencing:** High-depth 16S rRNA amplicon sequencing.
*   **QC Filter:** Removed samples `\(&lt; 4,000\)` reads (n=2 dropped).
*   **Final Dataset:** `\(n=30\)` samples.
*   **Normalization:** Rarefied to 4688 reads/sample.
]

.pull-right[
&lt;img src="Kohl_Scientific_Presentation_files/figure-html/sample-dist-1.png" width="720" /&gt;
]

---

# Ecological Drivers: Beta Diversity

.pull-left[
### Principal Coordinates Analysis (PCoA)
*   **Metric:** Bray-Curtis Dissimilarity (Community Structure).
*   **Pattern:**
    *   **Maternal Clustering:** Distinct clusters by clutch (Colors).
    *   **Environmental Shift:** Separation between Muck/Sterile in later stages (Ellipses).

### Statistical Validation (PERMANOVA)
*   **Maternal Effect:** `\(R^2 = 0.25\)`, `\(p &lt; 0.001\)`
*   **Environmental Effect:** `\(R^2 = 0.13\)`, `\(p &lt; 0.001\)`
]

.pull-right[
&lt;img src="Kohl_Scientific_Presentation_files/figure-html/pcoa-1.png" width="720" /&gt;
]

# Mechanism 1: Host Selection vs. Neutral Drift

**Hypothesis:** Is community assembly random (Neutral Theory) or deterministic (Host Selection)?

.pull-left[
**Method:** Sloan Neutral Model fit.
*   **High `\(R^2\)`:** Stochastic assembly (Neutral).
*   **Low/Negative `\(R^2\)`:** Strong selection.

**Result:**
*   **$R^2 &lt; 0$:** The neutral model completely fails.
*   **Interpretation:** Abundance in the metacommunity does **not** predict prevalence in the host. The host actively selects specific taxa regardless of their environmental abundance.
]

.pull-right[
&lt;img src="Kohl_Scientific_Presentation_files/figure-html/neutral-model-1.png" width="720" /&gt;
]

---

# Mechanism 2: Functional Redundancy

**Hypothesis:** Does the microbiome conserve **Function** over **Taxonomy**?

.pull-left[
**Method:** Compare Beta-Diversity at:
1.  **OTU Level:** Fine-scale taxonomic turnover.
2.  **Family Level:** Proxy for functional guild turnover.

**Result:**
*   **Significantly Lower Variation** at the Family level.
*   **Interpretation:** Individual species may vary (stochastic colonization), but the functional roles (Families) are strictly conserved by the host.
]

.pull-right[
&lt;img src="Kohl_Scientific_Presentation_files/figure-html/func-redundancy-1.png" width="720" /&gt;
]

---

# Conclusions

### 1. Host Control is Paramount
*   **Maternal Identity** explains ~25% of variation.
*   **Neutral Model Rejection** confirms deterministic selection, not random drift.
*   **Functional Redundancy** suggests the host selects for metabolic guilds, not specific species.

### 2. Environmental Modulation is Significant but Secondary
*   **Environmental Effect** explains ~13% of variation (`\(p &lt; 0.001\)`).
*   **Recruitment:** The environment successfully introduces "Muck-specific" core taxa (e.g., specific *Bacteroidetes* and *Proteobacteria*).

### 3. Implications
The *Nerodia rhombifer* microbiome is a **highly regulated system**. While environmental microbes can colonize, they do so within a strict ecological framework defined by the host's biology and maternal inheritance.
